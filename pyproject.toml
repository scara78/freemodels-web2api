[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freemodels-web2api"
version = "0.1.0"
description = "A cautious local OpenAI-compatible adapter for the public FreeModels.pro chat interface"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Saad Shafiq" }]
keywords = ["openai-compatible", "api-adapter", "sse", "interoperability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
sdk = ["openai>=1,<3"]

[project.urls]
Homepage = "https://github.com/malikmuhammadsaadshafiq-dev/freemodels-web2api"
Issues = "https://github.com/malikmuhammadsaadshafiq-dev/freemodels-web2api/issues"

[project.scripts]
freemodels-web2api = "freemodels_web2api:main"

[tool.setuptools]
py-modules = ["freemodels_web2api"]
