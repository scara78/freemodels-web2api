<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">FreeModels Web2API</title>
  <desc id="desc">A glowing bridge between chat bubbles and API brackets</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="956" height="256" rx="34" fill="url(#bg)" stroke="#8b5cf6" stroke-opacity=".32" stroke-width="4"/>
  <rect x="2" y="2" width="956" height="256" rx="34" fill="url(#grid)"/>
  <circle cx="128" cy="130" r="78" fill="#a855f7" opacity=".13" filter="url(#glow)"/>
  <path d="M75 84h102a23 23 0 0 1 23 23v47a23 23 0 0 1-23 23h-45l-29 24 7-24H75a23 23 0 0 1-23-23v-47a23 23 0 0 1 23-23Z" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M88 130h22m18 0h22m18 0h6" stroke="#f8fafc" stroke-width="9" stroke-linecap="round"/>
  <path d="M222 104c22 0 22 52 44 52s22-52 44-52" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M347 84l-35 46 35 46M423 84l35 46-35 46" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M398 72l-28 116" stroke="#a855f7" stroke-width="9" stroke-linecap="round"/>
  <text x="500" y="122" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="750" letter-spacing="-2">FreeModels</text>
  <text x="500" y="176" fill="url(#accent)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="44" font-weight="700">Web2API</text>
  <circle cx="892" cy="54" r="7" fill="#34d399"/>
  <text x="500" y="211" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="1.2">LOCAL • OPENAI-COMPATIBLE • EXPERIMENTAL</text>
</svg>
